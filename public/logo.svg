<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Projekts Inteliģence">
  <!--
    A cut piece of amber, the Baltic's own stone and common to Estonia, Latvia and Lithuania,
    with a watching eye at its heart. The same mark as favicon.svg, drawn larger.
  -->
  <g transform="translate(120 40) scale(2.5)">
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#f2a224"/>
    <polygon points="32,4 56,18 32,32" fill="#ffc95c"/>
    <polygon points="8,18 32,4 32,32" fill="#f7b544"/>
    <polygon points="8,46 32,60 32,32" fill="#c8740f"/>
    <polygon points="56,46 32,60 32,32" fill="#a85d0b"/>
    <circle cx="32" cy="32" r="8" fill="#0e2a47"/>
    <circle cx="34.8" cy="29.2" r="2.2" fill="#fff4dc"/>
  </g>
</svg>
