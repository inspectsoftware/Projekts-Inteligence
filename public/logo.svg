<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Projekts Inteliģence">
  <defs>
    <clipPath id="flag"><rect x="20" y="20" width="360" height="200" rx="6"/></clipPath>
    <radialGradient id="iris" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#c8414c"/>
      <stop offset="0.6" stop-color="#9e3039"/>
      <stop offset="1" stop-color="#5e1a21"/>
    </radialGradient>
  </defs>

  <!-- Latvian flag: carmine, white, carmine in 2:1:2 -->
  <g clip-path="url(#flag)">
    <rect x="20" y="20" width="360" height="200" fill="#9e3039"/>
    <rect x="20" y="100" width="360" height="40" fill="#f4f6f8"/>
    <!-- Rays of the all-seeing eye, fanning out over both carmine bands -->
    <g stroke="#f4f6f8" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
      <path d="M200 62V30M200 178v32M158 70l-16-28M242 70l16-28M158 170l-16 28M242 170l16 28M124 86l-30-20M276 86l30-20M124 154l-30 20M276 154l30 20"/>
    </g>
  </g>

  <!-- The eye, sitting on the white band and breaking out of it -->
  <path d="M96 120C128 76 164 62 200 62s72 14 104 58c-32 44-68 58-104 58s-72-14-104-58Z" fill="#f4f6f8" stroke="#04070a" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="200" cy="120" r="40" fill="url(#iris)" stroke="#04070a" stroke-width="5"/>
  <circle cx="200" cy="120" r="17" fill="#04070a"/>
  <circle cx="213" cy="107" r="6.5" fill="#f4f6f8"/>
</svg>
