name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check

      # Hostinger builds on Linux and may install without devDependencies.
      # Reproduce that worst case so a broken deploy shows up here first.
      - name: Production-style build
        run: |
          rm -rf node_modules dist
          npm ci --omit=dev
          npm run build

      - name: Boot check
        run: |
          PORT=8080 node dist/server/index.js &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = "404"
