<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PROJEKTS INTELIĢENCE // Baltic states</title>
    <!-- What a link to the site shows when it is posted: one card for every view, as the view itself is in the fragment the server never sees. -->
    <meta name="description" content="A live open-source intelligence map of Latvia and the Baltic: aircraft, ships, GPS interference, weather, news and live cameras, from public sources only." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Projekts Inteliģence" />
    <meta property="og:title" content="Projekts Inteliģence: a live map of the Baltic" />
    <meta property="og:description" content="Aircraft, ships, GPS interference, weather, news and live cameras across Latvia and the Baltic, from public sources only." />
    <meta property="og:url" content="https://inteligence.lv/" />
    <meta property="og:image" content="https://inteligence.lv/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A dark map of the Baltic with aircraft, ships and GPS-jammed areas drawn in red around Latvia" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Splash: painted before any script loads. The eye opens, looks around and closes;
         the app then lets it go (src/ui/boot.ts) and the page zooms in through it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ececec;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, #ffffff 0%, #ececec 70%);
        color: #1c1c1c;
        font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        transition:
          opacity 0.55s ease,
          transform 0.55s cubic-bezier(0.6, 0, 0.9, 0.4);
      }
      #boot.done {
        opacity: 0;
        transform: scale(2.4);
        pointer-events: none;
      }
      .boot-box {
        width: min(340px, 72vw);
        text-align: center;
      }
      .boot-logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 28px rgb(242 162 36 / 0.3));
      }
      .boot-gem,
      .boot-gaze {
        transform-box: fill-box;
        transform-origin: center;
      }
      /* 3.4 s in all: the amber turns in, light runs over its facets, the eye looks left, right, up, back. */
      .boot-gem {
        animation: boot-gem 3.4s cubic-bezier(0.34, 1.4, 0.64, 1) both;
      }
      .boot-gaze {
        animation: boot-look 3.4s ease-in-out both;
      }
      .boot-glint {
        animation: boot-glint 3.4s ease-in-out both;
      }
      .boot-title {
        margin-top: 22px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.32em;
        color: #0a0a0a;
      }
      .boot-sub {
        margin-top: 2px;
        color: #555555;
      }
      /* Light unless the device asks for dark, as the app itself decides (useTheme). */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0a0a;
        }
        #boot {
          background: radial-gradient(ellipse at center, #191919 0%, #0a0a0a 70%);
          color: #e5e5e5;
        }
        .boot-title {
          color: #f4f6f8;
        }
        .boot-sub {
          color: #a3a3a3;
        }
      }
      @keyframes boot-gem {
        0% {
          opacity: 0;
          transform: scale(0.55) rotate(-60deg);
        }
        22%,
        88% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        100% {
          opacity: 1;
          transform: scale(0.94) rotate(0deg);
        }
      }
      /* In the stone's own units (it is drawn 64 wide): the eye never leaves its facets. */
      @keyframes boot-look {
        0%,
        30% {
          transform: translate(0, 0);
        }
        40%,
        46% {
          transform: translate(-6px, 0.5px);
        }
        58%,
        64% {
          transform: translate(6px, 0.5px);
        }
        74%,
        78% {
          transform: translate(1.5px, -3.5px);
        }
        88%,
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes boot-glint {
        0%,
        20% {
          opacity: 0;
        }
        32% {
          opacity: 0.7;
        }
        48%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-gem,
        .boot-gaze,
        .boot-glint {
          animation: none;
        }
        .boot-glint {
          opacity: 0;
        }
        #boot.done {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="boot-box">
        <svg class="boot-logo" viewBox="0 0 400 240" aria-hidden="true">
          <!-- The logo (public/logo.svg): a cut piece of amber with a watching eye at its heart. -->
          <g transform="translate(120 40) scale(2.5)">
            <g class="boot-gem">
              <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#f2a224" />
              <polygon points="32,4 56,18 32,32" fill="#ffc95c" />
              <polygon points="8,18 32,4 32,32" fill="#f7b544" />
              <polygon points="8,46 32,60 32,32" fill="#c8740f" />
              <polygon points="56,46 32,60 32,32" fill="#a85d0b" />
              <!-- Light running over the upper facets -->
              <polygon class="boot-glint" points="32,4 56,18 32,32 8,18" fill="#fff4dc" opacity="0" />
              <g class="boot-gaze">
                <circle cx="32" cy="32" r="8" fill="#0e2a47" />
                <circle cx="34.8" cy="29.2" r="2.2" fill="#fff4dc" />
              </g>
            </g>
          </g>
        </svg>
        <div class="boot-title">PROJEKTS INTELIĢENCE</div>
        <div class="boot-sub">BALTIC STATES // LIVE MAP</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
