<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#04070a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PROJEKTS INTELIĢENCE // Latvia</title>
    <style>
      /* Splash: painted before any script loads. The eye opens, looks around and closes;
         the app then lets it go (src/ui/boot.ts) and the page zooms in through it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04070a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, #0a1118 0%, #04070a 70%);
        color: #d5e1ea;
        font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        transition:
          opacity 0.55s ease,
          transform 0.55s cubic-bezier(0.6, 0, 0.9, 0.4);
      }
      #boot.done {
        opacity: 0;
        transform: scale(2.4);
        pointer-events: none;
      }
      .boot-box {
        width: min(340px, 72vw);
        text-align: center;
      }
      .boot-logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 28px rgb(158 48 57 / 0.35));
      }
      .boot-eye,
      .boot-iris,
      .boot-rays {
        transform-box: fill-box;
        transform-origin: center;
      }
      /* 3.4 s in all: shut, open, left, right, up, centre, shut. */
      .boot-eye {
        animation: boot-lids 3.4s cubic-bezier(0.5, 0, 0.3, 1) both;
      }
      .boot-iris {
        animation: boot-look 3.4s ease-in-out both;
      }
      .boot-rays {
        animation: boot-rays 3.4s ease-out both;
      }
      .boot-title {
        margin-top: 22px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.32em;
        color: #f4f6f8;
      }
      .boot-sub {
        margin-top: 2px;
        color: #8499a8;
      }
      @keyframes boot-lids {
        0%,
        8% {
          transform: scaleY(0.02);
        }
        22%,
        84% {
          transform: scaleY(1);
        }
        96%,
        100% {
          transform: scaleY(0.02);
        }
      }
      @keyframes boot-look {
        0%,
        26% {
          transform: translate(0, 0);
        }
        38%,
        44% {
          transform: translate(-30px, 2px);
        }
        56%,
        62% {
          transform: translate(30px, 2px);
        }
        72%,
        76% {
          transform: translate(8px, -12px);
        }
        84%,
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes boot-rays {
        0%,
        14% {
          opacity: 0;
          transform: scale(0.7);
        }
        30%,
        84% {
          opacity: 0.55;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-eye,
        .boot-iris,
        .boot-rays {
          animation: none;
        }
        .boot-rays {
          opacity: 0.55;
        }
        #boot.done {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="boot-box">
        <svg class="boot-logo" viewBox="0 0 400 240" aria-hidden="true">
          <defs>
            <clipPath id="boot-flag"><rect x="20" y="20" width="360" height="200" rx="6" /></clipPath>
            <clipPath id="boot-ball"><path d="M96 120C128 76 164 62 200 62s72 14 104 58c-32 44-68 58-104 58s-72-14-104-58Z" /></clipPath>
            <radialGradient id="boot-iris" cx="50%" cy="45%" r="55%">
              <stop offset="0" stop-color="#c8414c" />
              <stop offset="0.6" stop-color="#9e3039" />
              <stop offset="1" stop-color="#5e1a21" />
            </radialGradient>
          </defs>
          <g clip-path="url(#boot-flag)">
            <rect x="20" y="20" width="360" height="200" fill="#9e3039" />
            <rect x="20" y="100" width="360" height="40" fill="#f4f6f8" />
            <g class="boot-rays" stroke="#f4f6f8" stroke-width="2.5" stroke-linecap="round">
              <path d="M200 62V30M200 178v32M158 70l-16-28M242 70l16-28M158 170l-16 28M242 170l16 28M124 86l-30-20M276 86l30-20M124 154l-30 20M276 154l30 20" />
            </g>
          </g>
          <g class="boot-eye">
            <path d="M96 120C128 76 164 62 200 62s72 14 104 58c-32 44-68 58-104 58s-72-14-104-58Z" fill="#f4f6f8" />
            <g clip-path="url(#boot-ball)">
              <g class="boot-iris">
                <circle cx="200" cy="120" r="40" fill="url(#boot-iris)" stroke="#04070a" stroke-width="5" />
                <circle cx="200" cy="120" r="17" fill="#04070a" />
                <circle cx="213" cy="107" r="6.5" fill="#f4f6f8" />
              </g>
            </g>
            <path d="M96 120C128 76 164 62 200 62s72 14 104 58c-32 44-68 58-104 58s-72-14-104-58Z" fill="none" stroke="#04070a" stroke-width="7" stroke-linejoin="round" />
          </g>
        </svg>
        <div class="boot-title">PROJEKTS INTELIĢENCE</div>
        <div class="boot-sub">LATVIA // INTELLIGENCE PANEL</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
