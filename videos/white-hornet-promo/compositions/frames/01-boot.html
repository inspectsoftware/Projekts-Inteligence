    <script>
      (function () {
        var $ = function (id) { return document.getElementById("01-boot-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["01-boot"] = tl;

        var DUR = 4, CYAN = "#4fd6ff", DIM = "#8499a8", GREEN = "#3ddc97";

        // ---- Scene 1–2: boot log, typed behind a block caret (pure function of time) ----
        // t0–t1: the line types; done: its status word flips to `fin`.
        var LINES = [
          { label: "UPLINK ........ ", pending: "ESTABLISHING", t0: 0.10, t1: 0.62, done: 0.68, fin: "OK", finColor: GREEN },
          { label: "BASEMAP ....... ", pending: "STANDBY",      t0: 0.68, t1: 1.14, done: 1.20, fin: "OK", finColor: GREEN },
          { label: "FEEDS ......... ", pending: "STANDBY",      t0: 1.20, t1: 1.66, done: 2.45, fin: "24 FEEDS LIVE", finColor: CYAN }
        ];
        var TYPING_GRACE = 0.12, BLINK_PERIOD = 0.5; // 8 whole blink cycles in 4s
        var rows = $("log").querySelectorAll("div:not([id])");
        LINES.forEach(function (l, i) {
          l.full = l.label + l.pending;
          l.labelEl = rows[i].querySelector('[data-k="label"]');
          l.statusEl = rows[i].querySelector('[data-k="status"]');
          l.caretEl = rows[i].querySelector('[data-k="caret"]');
        });

        // ---- Scene 3: wordmark, per-char 3D flip-decode ----
        var word = $("word");
        var GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        var FLIP_START = 2.7, FLIP_DUR = 0.5, CHAR_STAGGER = 0.035, REVEAL = 0.65, FLICKER = 0.1;
        var chars = [];
        word.dataset.target.split("").forEach(function (ch, i) {
          var span = document.createElement("span");
          if (ch === " ") { span.setAttribute("data-gap", ""); word.appendChild(span); return; }
          var ghost = document.createElement("i"); ghost.textContent = ch;
          var live = document.createElement("b"); live.textContent = ch;
          span.appendChild(ghost); span.appendChild(live); word.appendChild(span);
          chars.push({ el: span, live: live, target: ch, i: i });
        });
        function pseudoGlyph(seed) {
          var h = ((seed * 9301 + 49297) % 233280) / 233280;
          return GLYPHS[Math.floor(h * GLYPHS.length)];
        }

        function render(t) {
          var active = 0;
          LINES.forEach(function (l, i) { if (t >= l.t0) active = i; });
          LINES.forEach(function (l, i) {
            var n = Math.max(0, Math.min(l.full.length, Math.floor(((t - l.t0) / (l.t1 - l.t0)) * l.full.length)));
            var isDone = t >= l.done;
            l.labelEl.textContent = l.full.slice(0, Math.min(n, l.label.length));
            l.statusEl.textContent = isDone ? l.fin : l.full.slice(l.label.length, n);
            l.statusEl.style.color = isDone ? l.finColor : DIM;
            var c = l.caretEl.style;
            c.display = i === active ? "inline-block" : "none";
            // caret colour follows the segment being typed: cyan on the label, dim on the pending status
            c.background = n > l.label.length && !isDone ? DIM : CYAN;
            var typing = t >= l.t0 && t < l.t1 + TYPING_GRACE;
            c.opacity = typing || Math.sin((t / BLINK_PERIOD) * Math.PI * 2) > 0 ? "1" : "0";
          });

          chars.forEach(function (c) {
            var local = t - (FLIP_START + c.i * CHAR_STAGGER);
            var x = Math.max(0, Math.min(1, local / FLIP_DUR));
            var p = 1 - (1 - x) * (1 - x); // power2.out
            c.live.textContent = p < REVEAL ? pseudoGlyph(c.i * 1000 + Math.floor(Math.max(0, local) / FLICKER)) : c.target;
            c.el.style.transform = "rotateX(" + (90 - p * 90) + "deg)";
            c.el.style.opacity = String(Math.min(1, p * 2));
          });
        }

        var driver = { t: 0 };
        tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(driver.t); } }, 0);
        render(0);

        // Scene 2 (1.8–2.6): one finite cyan sweep under the log; status flips at 2.45 via render()
        tl.fromTo($("sweep"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 1.85);

        // Scene 3 (2.6–4.0): log dims to 30% and docks into the top-left bracket, clearing the centre
        tl.to($("log"), { opacity: 0.3, x: -440, y: -290, scale: 0.7, duration: 0.5, ease: "power2.inOut" }, 2.6);
        tl.fromTo($("mark"), { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power2.out" }, 2.65);
        $("hud").querySelectorAll("path").forEach(function (p, i) {
          tl.fromTo(p, { strokeDashoffset: 112 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.85 + i * 0.12);
        });
        tl.fromTo($("sub"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power1.out" }, 3.1);
        // everything is landed by ~3.6s; holds still to the cut (caret keeps its idle blink)
      })();
