    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="05-tv"]');
        var q = function (s) { return root.querySelector(s); };
        var D = 6;

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05-tv"] = tl;

        // --- Scene 1: slow map drift under everything + window rises into place
        tl.fromTo(q(".f05-tv-map"), { scale: 1.06 }, { scale: 1, duration: D, ease: "none" }, 0);
        tl.fromTo(q(".f05-tv-win"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 0);

        // --- audio bars: heights from a fixed index-derived table, finite tweens only
        var N = 40, STEP = 0.2, T0 = 1.2;
        var LEVELS = [];
        for (var i = 0; i < N; i++) LEVELS.push(0.14 + 0.86 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.6)));
        var barsEl = q(".f05-tv-bars");
        var steps = Math.round((D - T0) / STEP);
        for (var b = 0; b < N; b++) {
          var bar = document.createElement("div");
          bar.className = "f05-tv-bar";
          barsEl.appendChild(bar);
          for (var k = 0; k < steps; k++) {
            var from = k === 0 ? 0.06 : LEVELS[(b * 3 + (k - 1) * 7) % N];
            tl.fromTo(bar, { scaleY: from }, { scaleY: LEVELS[(b * 3 + k * 7) % N], duration: STEP, ease: "sine.inOut", immediateRender: k === 0 }, T0 + k * STEP);
          }
        }

        // --- channel states (Scenes 2-5): one table, applied discretely from one driver
        // row = rail row centre in window-local px; sil / lec = x offset of silhouette / lectern (a different "shot")
        var CUTS = [
          { t: 1.2,  row: 96,  title: "SAEIMA",               sub: "PLENARY SITTING", sil: 0,    lec: 0,    flags: 0 },
          { t: 2.4,  row: 120, title: "CABINET OF MINISTERS", sub: "PRESS BRIEFING",  sil: 150,  lec: -170, flags: 0 },
          { t: 3.5,  row: 145, title: "PRESIDENT OF LATVIA",  sub: "ADDRESS",         sil: 0,    lec: 0,    flags: 1 },
          { t: 4.6,  row: 419, title: "SEIMAS",               sub: "LT // PARLIAMENT", sil: -160, lec: -160, flags: 0 },
          { t: 5.05, row: 521, title: "RIIGIKOGU",            sub: "EE // PARLIAMENT", sil: 170,  lec: 170,  flags: 0 }
        ];
        // headline: hard-cut word build (discrete-text-sequence)
        var HEAD = [
          { t: 4.85, a: "WHO", b: "" },
          { t: 5.0,  a: "WHO IS", b: "" },
          { t: 5.2,  a: "WHO IS SPEAKING.", b: "" },
          { t: 5.45, a: "WHO IS SPEAKING.", b: " RIGHT" },
          { t: 5.6,  a: "WHO IS SPEAKING.", b: " RIGHT NOW." }
        ];
        var KICKER = "LIVE TV // 24 CHANNELS · LV LT EE";

        function latest(seq, time) {
          for (var i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return i;
          return -1;
        }

        var el = {
          kicker: q(".f05-tv-kicker"), hl: q(".f05-tv-hl"), player: q(".f05-tv-player"), shot: q(".f05-tv-shot"),
          sil: q(".f05-tv-sil"), lec: q(".f05-tv-lec"), flags: q(".f05-tv-flags"),
          title: q(".f05-tv-l3-title"), sub: q(".f05-tv-l3-sub"),
          glA: q(".f05-tv-gl-a"), glB: q(".f05-tv-gl-b"),
          scrim: q(".f05-tv-head-scrim"), ha: q(".f05-tv-headline-a"), hb: q(".f05-tv-headline-b")
        };

        function apply(t) {
          // kicker types on (smooth slice) during Scene 1
          var kp = Math.min(1, Math.max(0, (t - 0.15) / 0.9));
          el.kicker.textContent = KICKER.substring(0, Math.floor(kp * KICKER.length));

          var i = latest(CUTS, t);
          if (i < 0) {
            el.hl.style.opacity = "0";
            el.player.style.opacity = "0";
          } else {
            var c = CUTS[i];
            el.hl.style.opacity = "1";
            el.hl.style.transform = "translateY(" + (c.row - 12) + "px)";
            el.player.style.opacity = "1";
            el.sil.style.transform = "translateX(" + c.sil + "px)";
            el.lec.style.transform = "translateX(" + c.lec + "px)";
            el.flags.style.opacity = c.flags ? "1" : "0";
            el.title.textContent = c.title;
            el.sub.textContent = c.sub;

            // 2-frame horizontal glitch slice on each cut, then clean
            var dt = t - c.t;
            var phase = dt < 0.03 ? 1 : dt < 0.065 ? 2 : 0;
            if (phase === 1) {
              el.shot.style.clipPath = "inset(0 0 56% 0)";
              el.shot.style.transform = "translateX(26px)";
            } else if (phase === 2) {
              el.shot.style.clipPath = "inset(37% 0 0 0)";
              el.shot.style.transform = "translateX(-16px)";
            } else {
              el.shot.style.clipPath = "none";
              el.shot.style.transform = "none";
            }
            el.glA.style.opacity = phase ? "0.8" : "0";
            el.glB.style.opacity = phase ? "0.45" : "0";
            el.glA.style.top = (phase === 1 ? 268 : 226) + (i * 13) % 40 + "px";
            el.glA.style.height = (phase === 1 ? 3 : 2) + "px";
            el.glB.style.top = (phase === 1 ? 120 : 430) + (i * 29) % 60 + "px";
            el.glB.style.height = (phase === 1 ? 10 : 6) + "px";
          }

          var h = latest(HEAD, t);
          el.scrim.style.opacity = h < 0 ? "0" : "1";
          el.ha.textContent = h < 0 ? "" : HEAD[h].a;
          el.hb.textContent = h < 0 ? "" : HEAD[h].b;
        }

        var driver = { t: 0 };
        tl.to(driver, { t: D, duration: D, ease: "none", onUpdate: function () { apply(driver.t); } }, 0);
        apply(0);
      })();
