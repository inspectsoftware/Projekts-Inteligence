  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (name) => document.querySelector('[id="04-cameras-' + name + '"]');
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.5): reticle blinks, camera window morphs out of it ──
      const MORPH_START = 0.4;
      const MORPH_DUR = 0.7;
      const START_SCALE = 150 / 1200; // 150px-wide seed at the reticle centre

      tl.to($("reticle"), { opacity: 0.15, duration: 0.05, ease: "none" }, 0.3);
      tl.to($("reticle"), { opacity: 1, duration: 0.05, ease: "none" }, 0.35);
      tl.to($("reticle"), { scale: 1.5, opacity: 0, duration: 0.3, ease: "power2.out" }, MORPH_START);

      // card-morph-anchor: one tween, uniform scale + paint-only channels
      tl.fromTo(
        $("card"),
        {
          scale: START_SCALE,
          borderRadius: 380, // pre-scale: reads as a ~47px-radius capsule at the reticle
          boxShadow: "0 0 0 16px rgba(79,214,255,1)", // 2px apparent cyan stroke
        },
        {
          scale: 1,
          borderRadius: 0,
          boxShadow: "0 0 0 1px rgba(42,63,78,1)",
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        MORPH_START,
      );
      tl.fromTo($("card"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, MORPH_START);
      tl.fromTo(
        $("viewimg"),
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR * 0.5, ease: "power1.out" },
        MORPH_START + MORPH_DUR * 0.4,
      );

      // depth-of-field-blur: plate recedes on the same window (modest radius, dim does the work)
      tl.to($("plate"), { "--dof": "5px", opacity: 0.45, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);

      tl.fromTo($("tag"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 1.0);
      tl.fromTo($("live"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.2);

      // ── Scene 2 (1.5–2.7): scale-swap to the camera grid, highlight steps the top row ──
      const TRIGGER = 1.5;
      const EXIT_DUR = 0.35;
      const OVERLAP = 0.15;
      const EXIT_SCALE = 0.72;

      tl.to($("card"), { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);
      tl.fromTo(
        $("grid"),
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.4)" },
        TRIGGER + EXIT_DUR - OVERLAP,
      );
      tl.to($("tag-a"), { opacity: 0, duration: 0.15, ease: "power1.in" }, TRIGGER);
      tl.fromTo($("tag-b"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, TRIGGER + 0.2);

      const TILE_X = [0, 149, 299, 448]; // offsets from tile 1 (x=5) to tiles at 154 / 304 / 453
      const BEAT = 0.2;
      const HL_START = 1.95;
      tl.fromTo($("hl"), { opacity: 0, x: TILE_X[0] }, { opacity: 1, x: TILE_X[0], duration: 0.08, ease: "none" }, HL_START);
      for (let i = 1; i < TILE_X.length; i++) {
        tl.to($("hl"), { x: TILE_X[i], duration: 0.09, ease: "power3.out" }, HL_START + BEAT * i);
      }

      // ── Scene 3 (2.7–4.0): headline per-word on the scrim, chips pop, hold ──
      tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.7);

      // dynamic-content-sequencing: word starts pre-computed once from word length
      const WORD_BASE = 0.05;
      const SEC_PER_CHAR = 0.007;
      let cursor = 2.78;
      $("head")
        .querySelectorAll("span")
        .forEach((word) => {
          tl.fromTo(word, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, cursor);
          cursor += WORD_BASE + word.textContent.length * SEC_PER_CHAR;
        });

      $("chips")
        .querySelectorAll("span")
        .forEach((chip, i) => {
          tl.fromTo(
            chip,
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(1.8)" },
            3.1 + i * 0.07,
          );
        });

      tl.set({}, {}, 4); // pin the timeline to the frame's 4s duration

      window.__timelines = window.__timelines || {};
      window.__timelines["04-cameras"] = tl;
    })();
  </script>
