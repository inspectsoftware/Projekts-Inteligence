    <script>
      (function () {
        var ID = "07-everything";
        var root = document.querySelector('[data-composition-id="' + ID + '"]');
        var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
        var cls = function (n) { return '[class~="' + ID + "-" + n + '"]'; };

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;

        // ONE beat array drives plates, words, glitch and counter.
        var BEATS = [0, 0.8, 1.6, 2.4, 3.2, 4.0, 4.7, 5.4];
        var FRAME = 1 / 30;
        var plates = all(cls("plate"));
        var beats = all(cls("beat"));
        var num = root.querySelector(cls("num"));
        var count = { v: 0 };
        var showCount = function () {
          var n = Math.round(count.v);
          num.textContent = (n < 10 ? "0" : "") + n;
        };

        // distinct slam per word (kinetic-beat-slam)
        var SLAMS = [
          [{ scale: 1.5, filter: "blur(16px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.35, ease: "power4.out" }],
          [{ x: -320, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "expo.out" }],
          [{ y: 90, rotation: 6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.38, ease: "circ.out" }],
          [{ letterSpacing: "0.3em", opacity: 0 }, { letterSpacing: "-0.04em", opacity: 1, duration: 0.36, ease: "expo.out" }],
          [{ scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power4.out" }],
          [{ x: 320, skewX: -18, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.3, ease: "expo.out" }],
          [{ scaleY: 2.2, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3, ease: "power4.out" }]
        ];

        BEATS.forEach(function (t, i) {
          // hard cut: exactly one plate + one word at any seek
          if (i > 0) {
            tl.set([plates[i], beats[i]], { autoAlpha: 1 }, t);
            tl.set([plates[i - 1], beats[i - 1]], { autoAlpha: 0 }, t);
          }
          // plate punches in 1.08 -> 1.0, then never drifts
          tl.fromTo(plates[i], { scale: 1.08 }, { scale: 1, duration: 0.45, ease: "power3.out" }, t);

          // counter: +3 per beat, value and scale share timing + ease (counting-dynamic-scale)
          var last = i === BEATS.length - 1;
          var cd = last ? 0.5 : 0.3;
          tl.fromTo(count, { v: i * 3 }, { v: (i + 1) * 3, duration: cd, ease: "power3.out", immediateRender: false, onUpdate: showCount }, t);
          tl.fromTo(num, { scale: last ? 0.5 : 0.7 }, { scale: 1, duration: cd, ease: "power3.out", immediateRender: false }, t);

          if (i < SLAMS.length) {
            tl.fromTo(beats[i].querySelector(cls("word")), SLAMS[i][0], SLAMS[i][1], t);
            var sub = beats[i].querySelector(cls("sub"));
            if (sub) tl.fromTo(sub, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, t + 0.12);
          }
        });

        // 2-frame horizontal glitch slices on the NVG and FLIR cuts (fixed, index-derived offsets)
        [5, 6].forEach(function (p) {
          var t = BEATS[p];
          all('[data-p="' + p + '"] ' + cls("slice")).forEach(function (s, i) {
            var dx = (i % 2 ? 1 : -1) * (40 + i * 18);
            tl.set(s, { autoAlpha: 1, x: dx }, t);
            tl.set(s, { x: -dx * 0.4 }, t + FRAME);
            tl.set(s, { autoAlpha: 0, x: 0 }, t + FRAME * 2);
          });
        });

        // finale lockup: long-tail settle, then dead still from 6.1s
        tl.eventCallback("onUpdate", showCount); // keeps the counter text right on any seek direction
        var T8 = BEATS[7];
        tl.fromTo(root.querySelector('[data-l="0"]'), { y: 60, scale: 1.12, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, T8);
        tl.fromTo(root.querySelector('[data-l="1"]'), { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, T8 + 0.2);
      })();
