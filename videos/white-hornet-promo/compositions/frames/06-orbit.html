  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-orbit"] = tl;

      const $ = (id) => document.getElementById("06-orbit-" + id);
      const fx = $("fx");
      const all = (sel) => Array.from(fx.querySelectorAll(sel));

      /* ── Scene 1 (0–1.2s): hard pull-back 2.2 → 1.0, tight plate dissolves into the wide one, then STOP ── */
      const cam = $("cam");
      tl.fromTo(cam, { scale: 2.2, transformOrigin: "1000px 620px" }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      // gone by ~0.62s, before the pull-back uncovers the tight plate's shifted top edge (scale < 1.135)
      tl.fromTo($("tight"), { opacity: 1 }, { opacity: 0, duration: 0.54, ease: "power2.inOut" }, 0.08);
      // motion-blur-streak, wrapper level, symmetric (depth move): brief peak, sharp well before the stop
      const blur = { v: 0 };
      const writeBlur = () => { cam.style.filter = blur.v > 0.05 ? "blur(" + blur.v.toFixed(2) + "px)" : "none"; };
      tl.to(blur, { v: 8, duration: 0.18, ease: "power2.out", onUpdate: writeBlur }, 0.02);
      tl.to(blur, { v: 0, duration: 0.75, ease: "power3.out", onUpdate: writeBlur }, 0.2);

      /* ── Scene 2 (1.2–3.2s): ground tracks draw behind their satellites; kicker + per-word headline ── */
      // cubic control points [x0,y0, x1,y1, x2,y2, x3,y3] in map-satellites.png pixels
      const TRACKS = [
        { p: [812, -40, 742, 230, 712, 540, 744, 760], at: 1.25, dur: 3.75, ease: "power2.out" },   // ISS: N-S just west of Latvia
        { p: [1720, -40, 1480, 150, 1220, 330, 940, 462], at: 1.5, dur: 3.5, ease: "power1.out" },  // SENTINEL-2B: diagonal across Estonia
        { p: [-40, 640, 330, 860, 760, 880, 1190, 800], at: 1.75, dur: 3.25, ease: "power1.out" },  // NOAA-20: southern Baltic sweep
      ];
      // arc-length lookup so the satellite sits exactly on the head of the drawn stroke (no DOM geometry calls)
      function sampler(P) {
        const N = 200, pts = [], len = [0];
        for (let i = 0; i <= N; i++) {
          const t = i / N, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
          pts.push([a * P[0] + b * P[2] + c * P[4] + d * P[6], a * P[1] + b * P[3] + c * P[5] + d * P[7]]);
          if (i) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        }
        return function (prog) {
          const s = prog * len[N];
          let i = 1;
          while (i < N && len[i] < s) i++;
          const f = (s - len[i - 1]) / (len[i] - len[i - 1] || 1);
          return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
        };
      }
      const lines = all("[data-track]"), masks = all("[data-mask]"), sats = all("[data-sat]");
      TRACKS.forEach((T, i) => {
        const P = T.p, at = sampler(P);
        const end = at(1);
        console.assert(Math.hypot(end[0] - P[6], end[1] - P[7]) < 0.5, "06-orbit: track sampler end mismatch", i);
        const d = "M" + P[0] + " " + P[1] + " C" + P.slice(2).join(" ");
        lines[i].setAttribute("d", d);
        masks[i].setAttribute("d", d);
        const st = { p: 0 };
        const write = () => {
          const xy = at(st.p);
          masks[i].style.strokeDashoffset = String(1 - st.p);
          sats[i].setAttribute("transform", "translate(" + xy[0].toFixed(2) + " " + xy[1].toFixed(2) + ")");
        };
        write(); // seed t=0: satellite parked off-frame at the track's start, nothing drawn
        tl.to(st, { p: 1, duration: T.dur, ease: T.ease, onUpdate: write }, T.at);
      });

      tl.fromTo($("title"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.25);
      tl.fromTo($("kicker"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.3);
      // dynamic-content-sequencing: each word's start is derived from the length of the one before it
      const BASE = 0.25, SEC_PER_CHAR = 0.04;
      let cursor = 1.55;
      Array.from($("title").querySelectorAll("[data-w]")).forEach((w) => {
        tl.fromTo(w, { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, cursor);
        cursor += BASE + w.textContent.length * SEC_PER_CHAR;
      });

      /* ── Scene 3 (3.2–5.0s): seven hexes in sequence, one pulse each; leader, callout, counter ── */
      all("[data-hex]").forEach((g, i) => {
        const t = 3.2 + i * 0.12;
        const ring = g.querySelector("[data-ring]");
        tl.fromTo(g.querySelector("[data-fill]"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(ring, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
          { opacity: 0.9, scale: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.to(ring, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out" }, t + 0.25);
      });

      tl.fromTo($("leader-dot"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 3.3);
      tl.fromTo($("leader"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.3);
      tl.fromTo($("call"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.42);

      // counting-dynamic-scale: value + scale share window and ease; text written only when the integer changes
      const count = $("count"), state = { value: 0 };
      let shown = "";
      const COUNT_AT = 3.5, COUNT_DUR = 1.2, COUNT_EASE = "power3.out";
      const writeCount = () => {
        const s = String(Math.round(state.value)).padStart(2, "0");
        if (s !== shown) { count.textContent = s; shown = s; }
      };
      tl.to(state, { value: 13, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: writeCount }, COUNT_AT);
      tl.fromTo(count, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo($("count-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, COUNT_AT + 0.2);
    })();
  </script>
