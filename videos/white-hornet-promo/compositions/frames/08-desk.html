      (function () {
        var root = document.querySelector('[data-composition-id="08-desk"]');
        var q = function (n) { return root.querySelector('[class~="08-desk-' + n + '"]'); };
        var qa = function (n) { return root.querySelectorAll('[class~="08-desk-' + n + '"]'); };

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["08-desk"] = tl;

        // Scene 1 (0–1s): the ONE decelerating zoom-out, then the camera is locked.
        tl.fromTo(q("cam"), { scale: 1.6 }, { scale: 1, duration: 1, ease: "expo.out" }, 0);

        // Scene 2 (1.0–2.4s): windows snap home one per beat, guide flashes on landing.
        var wins = qa("win"), guides = qa("guide");
        wins.forEach(function (w, i) {
          var t = 1.0 + i * 0.27;
          tl.fromTo(w,
            { x: Number(w.dataset.dx), y: Number(w.dataset.dy), opacity: 0 },
            { x: 0, y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t);
          tl.set(guides[i], { opacity: 1 }, t + 0.16);
          tl.to(guides[i], { opacity: 0, duration: 0.2, ease: "power1.in" }, t + 0.26);
        });

        // Scene 3 (2.4–4s): desk defocuses, palette drops in and searches.
        tl.to(q("desk"), { "--dof": "3px", opacity: 0.45, duration: 0.5, ease: "power2.inOut" }, 2.4);

        // Two finite caret blinks: cos gate starts and ends visible (whole cycles).
        var caret = q("caret"), blink = { p: 0 };
        tl.to(blink, {
          p: Math.PI * 4, duration: 1.2, ease: "none",
          onUpdate: function () { caret.style.opacity = Math.cos(blink.p) >= 0 ? "1" : "0"; }
        }, 2.8);

        // Highlight steps down the first three rows (31px rows) — instant steps.

        tl.set(bar, { opacity: 1, y: 0 }, 2.95);
        tl.set(bar, { y: 31 }, 3.25);
