  <div data-hf-id="hf-c9wq" id="root" data-composition-id="02-plane" data-width="1920" data-height="1080">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById("02-plane-" + id);
      };
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1: one decisive pull-back, then the camera stops for good ──
      tl.fromTo($("cam"), { scale: 1.12 }, { scale: 1, duration: 2.6, ease: "power2.out" }, 0);

      // Flight path: quadratic curve from lower-left to exact centre, leaving at 35deg.
      var END_ROT = 35;
      var R = (END_ROT * Math.PI) / 180;
      var P0 = [250, 930];
      var P1 = [960, 540];
      var C = [P1[0] - 300 * Math.sin(R), P1[1] + 300 * Math.cos(R)];
      var bez = function (t) {
        var u = 1 - t;
        return [
          u * u * P0[0] + 2 * u * t * C[0] + t * t * P1[0],
          u * u * P0[1] + 2 * u * t * C[1] + t * t * P1[1],
        ];
      };
      // Arc-length table so the aircraft sits exactly on the head of the drawn trail.
      var N = 200;
      var lut = [0];
      var prev = bez(0);
      for (var i = 1; i <= N; i++) {
        var p = bez(i / N);
        lut[i] = lut[i - 1] + Math.hypot(p[0] - prev[0], p[1] - prev[1]);
        prev = p;
      }
      var tAt = function (s) {
        var target = s * lut[N];
        var k = 1;
        while (k < N && lut[k] < target) k++;
        var seg = lut[k] - lut[k - 1];
        return (k - 1 + (seg ? (target - lut[k - 1]) / seg : 0)) / N;
      };

      var jet = $("jet");
      var call = $("call");
      var trail = $("trail");
      trail.setAttribute("d", "M" + P0 + " Q" + C + " " + P1);
      var fly = { s: 0 };
      var place = function () {
        var x = P1[0];
        var y = P1[1];
        var rot = END_ROT;
        if (fly.s < 1) {
          var t = tAt(fly.s);
          var pt = bez(t);
          var dx = (1 - t) * (C[0] - P0[0]) + t * (P1[0] - C[0]);
          var dy = (1 - t) * (C[1] - P0[1]) + t * (P1[1] - C[1]);
          x = pt[0];
          y = pt[1];
          rot = (Math.atan2(dx, -dy) * 180) / Math.PI; // nose-up = 0deg
        }
        gsap.set(jet, { x: x - 48, y: y - 48, rotation: rot });
        gsap.set(call, { x: x + 42, y: y - 74 });
        trail.style.strokeDashoffset = 1 - fly.s;
      };
      place();
      tl.to(fly, { s: 1, duration: 2.8, ease: "power2.out", onUpdate: place }, 0);

      // Kicker types on (one opacity flip per character, layout pre-reserved).
      var kicker = $("kicker");
      var text = kicker.textContent;
      kicker.textContent = "";
      var chars = text.split("").map(function (ch) {
        var s = document.createElement("span");
        s.textContent = ch;
        kicker.appendChild(s);
        return s;
      });
      tl.fromTo(kicker, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.1);
      tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.05 }, 0.35);

      // ── Scene 2: arrival, selection ring, icon turns white, headline per word ──
      tl.fromTo(
        $("ring"),
        { scale: 1.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.75,
      );
      tl.to($("jetfill"), { fill: "#ffffff", duration: 0.2, ease: "power1.out" }, 2.75);
      tl.to(trail, { opacity: 0, duration: 0.7, ease: "power1.out" }, 3.0);

      tl.fromTo($("headbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.85);
      // Word starts computed from content length (longer word earns a longer beat).
      var WORD_BASE = 0.1;
      var SEC_PER_CHAR = 0.012;
      var at = 2.98;
      document.querySelectorAll('[class~="02-plane-w"]').forEach(function (w) {
        tl.fromTo(
          w,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          at,
        );
        at += WORD_BASE + w.textContent.length * SEC_PER_CHAR;
      });

      // ── Scene 3: the real Inspector slides in, leader line routes ring → panel, row ticks ──
      tl.fromTo($("insp"), { x: 540 }, { x: 0, duration: 0.6, ease: "power3.out" }, 3.8);
      tl.to(call, { opacity: 0, duration: 0.3, ease: "power1.out" }, 3.8); // callsign hands off to the dossier
      tl.fromTo(
        $("leader"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        4.1,
      );
      document.querySelectorAll('[class~="02-plane-tick"]').forEach(function (tick, n) {
        var start = 4.5 + n * 0.18;
        tl.fromTo(
          tick,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.15, ease: "power2.out" },
          start,
        );
        tl.to(tick, { opacity: 0.45, duration: 0.2, ease: "power1.out" }, start + 0.15);
      });

      // ── Scene 4: hold; the ring does one slow finite pulse and lands back at scale 1 ──
      tl.to($("ring"), { scale: 1.1, duration: 0.3, ease: "sine.inOut" }, 5.2);
      tl.to($("ring"), { scale: 1, duration: 0.3, ease: "sine.inOut" }, 5.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-plane"] = tl;
    })();
  </script>
