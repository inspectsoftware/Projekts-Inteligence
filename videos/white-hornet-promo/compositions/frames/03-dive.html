  <script>
    (function () {
      var $ = function (id) { return document.getElementById("03-dive-" + id); };
      var all = function (cls) { return Array.prototype.slice.call(document.querySelectorAll('[class~="03-dive-' + cls + '"]')); };

      var plates = all("plate");
      var ZP = plates.map(function (p) { return Number(p.dataset.z); }); // 8, 11, 14, 16.3, 18
      var FADE = 0.6; // zoom levels of cross-dissolve before the next plate takes over
      var blurEl = $("blur"), zEl = $("zval"), altEl = $("alt"), tagEl = $("tag");
      var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };

      // Basemap tag: hard cuts at the midpoint of each basemap change (discrete-text-sequence, keyed on Z).
      var TAGS = [{ z: 8, text: "DARK" }, { z: 10.7, text: "SENTINEL-2" }, { z: 13.7, text: "ORTHOPHOTO 0.25 M" }];

      var cam = { Z: 8 };

      // Pure function of cam.Z: plates, blur and HUD readouts. Safe to call at any seek position.
      function render() {
        var Z = cam.Z, i;
        for (i = 0; i < plates.length; i++) {
          var s = Math.pow(2, Z - ZP[i]);
          var o = i === 0 ? 1 : clamp01((Z - (ZP[i] - FADE)) / FADE);
          // the plate below stays until the next one overscans the blur margin, then drops out
          var covered = i < plates.length - 1 && Z >= ZP[i + 1] + 0.15;
          var st = plates[i].style;
          st.visibility = o > 0 && !covered && s <= 12 ? "inherit" : "hidden";
          st.opacity = o.toFixed(4);
          // True scale keeps each incoming plate in register with the one beneath; while it is still
          // smaller than the frame its edge is feathered away, and the feather is gone by scale 1.
          st.transform = "scale(" + s.toFixed(5) + ")";
          var t = clamp01((s - 0.6) / 0.4);
          var m = s >= 1 ? "none" : "radial-gradient(ellipse at center, #000 " + (45 + 65 * t).toFixed(1) + "%, transparent " + (70 + 65 * t).toFixed(1) + "%)";
          st.webkitMaskImage = m;
          st.maskImage = m;
        }

        // motion-blur-streak, camera-travel form: symmetric blur, 0 at both ends, peak mid-dive
        var f = (Z - 8) / 10;
        var b = 14 * Math.pow(Math.sin(Math.PI * f), 3);
        blurEl.style.filter = b < 0.1 ? "none" : "blur(" + b.toFixed(2) + "px)";

        var zs = Z.toFixed(2);
        zEl.textContent = zs.length < 5 ? "0" + zs : zs;
        var alt = Math.round((11278 * (Math.pow(2, 18 - Z) - 1)) / 1023);
        var a = ("     " + alt).slice(-5);
        altEl.textContent = a.slice(0, 2) + " " + a.slice(2);
        for (i = TAGS.length - 1; i >= 0; i--) {
          if (Z >= TAGS[i].z) { tagEl.textContent = TAGS[i].text; break; }
        }
      }

      var tl = gsap.timeline({ paused: true });

      // The dive: one proxy, Z 8 -> 18, slow start, fast middle, dead stop at 4.5s then a 0.5s hold.
      tl.to(cam, { Z: 18, duration: 4.5, ease: "power1.inOut" }, 0);
      tl.eventCallback("onUpdate", render);

      // Scene 1 (0-0.7s): the camera passes down through the aircraft.
      var plane = $("plane");
      tl.fromTo(plane, { rotation: 35, scale: 1 }, { rotation: 35, scale: 7, duration: 0.7, ease: "power2.in" }, 0);
      tl.fromTo(plane, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.in" }, 0.25);
      tl.fromTo($("kicker"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.15);

      // Scene 2 (0.7-3.6s): HUD stack arrives row by row, then ticks live from the proxy.
      tl.fromTo($("hud"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.7);
      tl.fromTo(all("row"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", stagger: 0.15 }, 0.8);

      // Scene 3 (3.6-5.0s): reticle gains its ticks, headline lands, then stillness.
      [["tick-n", "50% 100%"], ["tick-e", "0% 50%"], ["tick-s", "50% 0%"], ["tick-w", "100% 50%"]].forEach(function (t, i) {
        tl.fromTo($(t[0]), { opacity: 0, scale: 0, transformOrigin: t[1] }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 3.65 + i * 0.06);
      });
      tl.fromTo($("title"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.85);
      tl.fromTo($("head"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.95);
      tl.fromTo($("sub"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 4.25);

      tl.set({}, {}, 5); // pin the timeline length to the 5s slot

      render(); // t=0 state (handoff_in) without waiting for the first seek

      window.__timelines = window.__timelines || {};
      window.__timelines["03-dive"] = tl;
    })();
  </script>
